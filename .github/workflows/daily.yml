name: Daily data refresh

on:
  schedule:
    - cron: "47 10 * * *" # off the hour on purpose: GitHub delays on-the-hour schedules
  workflow_dispatch:

permissions:
  contents: write # commit refreshed exports/*.json — nothing else is needed

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "secrets not configured, skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.guard.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: uv sync --all-extras

      # pipeline.flows runs the whole chain itself: ingest -> dbt build (with all
      # data-quality tests) -> backtests -> leaderboard -> retention -> export.
      - name: Run daily pipeline flow
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: uv run python -m pipeline.flows

      - name: Derive dbt connection settings
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -c "from pipeline.config import dbt_env; [print(f'{k}={v}') for k, v in dbt_env().items()]" >> "$GITHUB_ENV"

      # Freshness is a clock check, not a data check, so `dbt build` never runs it.
      - name: dbt source freshness
        if: steps.guard.outputs.configured == 'true'
        run: uv run dbt source freshness --profiles-dir dbt --project-dir dbt

      - name: Commit refreshed exports
        if: steps.guard.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A shell glob is not recursive: `exports/*.json` staged index.json and silently
          # skipped the 48 backtests/<SYMBOL>.json the site charts, for 18 days. -A also
          # stages the per-symbol files export.py prunes.
          git add -A exports/
          if git diff --cached --quiet; then
            echo "exports unchanged, nothing to commit"
          else
            git commit -m "data: daily refresh [skip ci]"
            git push
          fi

      - name: Supabase keep-alive ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Best-effort, never fatal. The flow above already opened a connection
          # and wrote to the warehouse, and that IS the activity that keeps a
          # free-tier project from pausing — this ping only covers the REST API.
          # It exited 22 on a run whose data published perfectly (FALLO-29): a
          # red job must mean the data is wrong, or nobody reads the red.
          if [ -n "$SUPABASE_URL" ]; then
            if curl -fsS -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/" -o /dev/null; then
              echo "Supabase project pinged"
            else
              echo "::warning::Supabase REST ping failed; the flow's own DB writes still count as activity"
            fi
          else
            echo "SUPABASE_URL not set, skipping ping"
          fi

      # No keep-alive action here on purpose. GitHub disables a public repo's
      # scheduled workflows after 60 days without repository activity, and the
      # commit step above is that activity: the export embeds `generated_at`, so
      # every successful run produces a commit. A third-party keep-alive action
      # was used until it was blocked by GitHub for a ToS violation and took the
      # whole job down with it — the runner cannot even start a job whose actions
      # it cannot resolve. One less dependency that can disappear.
