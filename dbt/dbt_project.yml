# medallion — dbt project transforming bronze raw candles into silver/gold relations.
name: medallion
version: "0.1.0"
require-dbt-version: ">=1.8.0"

profile: medallion

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  medallion:
    +materialized: table
    staging:
      +schema: silver
    marts:
      +schema: gold

# The generate_schema_name override applies to seeds too, so +schema: silver
# lands the catalog at exactly silver.dim_assets (no target-schema prefix).
seeds:
  medallion:
    +schema: silver
    dim_assets:
      +column_types:
        symbol: text
        asset_class: text
        region: text
        name: text
        has_volume: boolean
