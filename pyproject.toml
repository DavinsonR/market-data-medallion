[project]
name = "market-data-medallion"
version = "0.1.0"
description = "Free-tier medallion data platform: market data APIs -> PostgreSQL (bronze/silver/gold with dbt) -> Python backtesting engine -> daily GitHub Actions orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Davinson Novoa" }]
dependencies = [
    "prefect>=3",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "pandas>=2",
    "pandera>=0.20",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "python-dotenv>=1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
