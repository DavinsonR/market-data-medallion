# Declarative pipeline configuration — the single place to add assets or strategies.
#
# Asset classes drive annualization (periods_per_year) and which strategies apply:
#   crypto  -> 365 trading days/year, has volume
#   equity  -> 252 trading days/year, has volume
#   fx      -> 252 trading days/year, NO volume (spot FX is OTC; no centralized tape)
#
# Tiingo free tier allows 50 requests/hour and 500 unique symbols/month. The 46
# Tiingo symbols below fit one hourly window; ingestion tolerates partial failures
# and self-heals on the next run via the bronze watermark.
granularity: "1d"

defaults:
  backfill_start: "2022-01-01"

assets:
  # ── Crypto (Coinbase primary, Kraken for cross-exchange reconciliation) ────────
  - { symbol: BTC-USD, asset_class: crypto, region: global, name: Bitcoin,
      sources: { primary: coinbase, reconcile: kraken } }
  - { symbol: ETH-USD, asset_class: crypto, region: global, name: Ethereum,
      sources: { primary: coinbase, reconcile: kraken } }

  # ── Broad-market ETFs ─────────────────────────────────────────────────────────
  - { symbol: SPY, asset_class: equity, region: us, name: SPDR S&P 500 ETF, sources: { primary: tiingo } }
  - { symbol: QQQ, asset_class: equity, region: us, name: Invesco QQQ (Nasdaq 100), sources: { primary: tiingo } }
  - { symbol: DIA, asset_class: equity, region: us, name: SPDR Dow Jones Industrial Average ETF, sources: { primary: tiingo } }
  - { symbol: IWM, asset_class: equity, region: us, name: iShares Russell 2000 ETF, sources: { primary: tiingo } }
  - { symbol: VTI, asset_class: equity, region: us, name: Vanguard Total Stock Market ETF, sources: { primary: tiingo } }

  # ── International / emerging-market ETFs ──────────────────────────────────────
  - { symbol: EFA, asset_class: equity, region: global, name: iShares MSCI EAFE ETF, sources: { primary: tiingo } }
  - { symbol: EEM, asset_class: equity, region: emerging, name: iShares MSCI Emerging Markets ETF, sources: { primary: tiingo } }
  - { symbol: VWO, asset_class: equity, region: emerging, name: Vanguard Emerging Markets ETF, sources: { primary: tiingo } }
  - { symbol: ILF, asset_class: equity, region: latam, name: iShares Latin America 40 ETF, sources: { primary: tiingo } }
  - { symbol: EWZ, asset_class: equity, region: latam, name: iShares MSCI Brazil ETF, sources: { primary: tiingo } }
  - { symbol: EWW, asset_class: equity, region: latam, name: iShares MSCI Mexico ETF, sources: { primary: tiingo } }
  - { symbol: ECH, asset_class: equity, region: latam, name: iShares MSCI Chile ETF, sources: { primary: tiingo } }

  # ── Sector and asset-class ETFs ───────────────────────────────────────────────
  - { symbol: XLE, asset_class: equity, region: us, name: Energy Select Sector SPDR, sources: { primary: tiingo } }
  - { symbol: XLF, asset_class: equity, region: us, name: Financial Select Sector SPDR, sources: { primary: tiingo } }
  - { symbol: XLK, asset_class: equity, region: us, name: Technology Select Sector SPDR, sources: { primary: tiingo } }
  - { symbol: XLV, asset_class: equity, region: us, name: Health Care Select Sector SPDR, sources: { primary: tiingo } }
  - { symbol: TLT, asset_class: equity, region: us, name: iShares 20+ Year Treasury Bond ETF, sources: { primary: tiingo } }
  - { symbol: HYG, asset_class: equity, region: us, name: iShares iBoxx High Yield Corporate Bond ETF, sources: { primary: tiingo } }
  - { symbol: GLD, asset_class: equity, region: global, name: SPDR Gold Shares, sources: { primary: tiingo } }
  - { symbol: SLV, asset_class: equity, region: global, name: iShares Silver Trust, sources: { primary: tiingo } }

  # ── FX (Tiingo FX endpoint; OHLC only, no volume) ─────────────────────────────
  - { symbol: USDCOP, asset_class: fx, region: latam, name: US Dollar / Colombian Peso, sources: { primary: tiingo_fx } }
  - { symbol: USDBRL, asset_class: fx, region: latam, name: US Dollar / Brazilian Real, sources: { primary: tiingo_fx } }
  - { symbol: USDMXN, asset_class: fx, region: latam, name: US Dollar / Mexican Peso, sources: { primary: tiingo_fx } }
  - { symbol: USDCLP, asset_class: fx, region: latam, name: US Dollar / Chilean Peso, sources: { primary: tiingo_fx } }
  - { symbol: USDPEN, asset_class: fx, region: latam, name: US Dollar / Peruvian Sol, sources: { primary: tiingo_fx } }
  - { symbol: EURUSD, asset_class: fx, region: global, name: Euro / US Dollar, sources: { primary: tiingo_fx } }

  # ── US large caps ─────────────────────────────────────────────────────────────
  - { symbol: AAPL,  asset_class: equity, region: us, name: Apple Inc, sources: { primary: tiingo } }
  - { symbol: MSFT,  asset_class: equity, region: us, name: Microsoft Corp, sources: { primary: tiingo } }
  - { symbol: NVDA,  asset_class: equity, region: us, name: NVIDIA Corp, sources: { primary: tiingo } }
  - { symbol: AMZN,  asset_class: equity, region: us, name: Amazon.com Inc, sources: { primary: tiingo } }
  - { symbol: GOOGL, asset_class: equity, region: us, name: Alphabet Inc, sources: { primary: tiingo } }
  - { symbol: META,  asset_class: equity, region: us, name: Meta Platforms Inc, sources: { primary: tiingo } }
  - { symbol: JPM,   asset_class: equity, region: us, name: JPMorgan Chase & Co, sources: { primary: tiingo } }
  - { symbol: XOM,   asset_class: equity, region: us, name: Exxon Mobil Corp, sources: { primary: tiingo } }
  - { symbol: JNJ,   asset_class: equity, region: us, name: Johnson & Johnson, sources: { primary: tiingo } }
  - { symbol: WMT,   asset_class: equity, region: us, name: Walmart Inc, sources: { primary: tiingo } }

  # ── Latin American ADRs (NYSE/NASDAQ-listed; no local-exchange feed on free tier)
  # fx_pair maps each ADR to the Tiingo USDXXX rate of its home currency, feeding
  # mart_fx_decomposition (how much of the USD return was the company vs the currency).
  - { symbol: EC,   asset_class: equity, region: latam, name: Ecopetrol SA (Colombia), sources: { primary: tiingo }, fx_pair: USDCOP }
  - { symbol: CIB,  asset_class: equity, region: latam, name: Bancolombia SA (Colombia), sources: { primary: tiingo }, fx_pair: USDCOP }
  - { symbol: VALE, asset_class: equity, region: latam, name: Vale SA (Brazil), sources: { primary: tiingo }, fx_pair: USDBRL }
  - { symbol: PBR,  asset_class: equity, region: latam, name: Petrobras (Brazil), sources: { primary: tiingo }, fx_pair: USDBRL }
  - { symbol: ITUB, asset_class: equity, region: latam, name: Itau Unibanco (Brazil), sources: { primary: tiingo }, fx_pair: USDBRL }
  - { symbol: ABEV, asset_class: equity, region: latam, name: Ambev SA (Brazil), sources: { primary: tiingo }, fx_pair: USDBRL }
  - { symbol: AMX,  asset_class: equity, region: latam, name: America Movil (Mexico), sources: { primary: tiingo }, fx_pair: USDMXN }
  - { symbol: FMX,  asset_class: equity, region: latam, name: Fomento Economico Mexicano (Mexico), sources: { primary: tiingo }, fx_pair: USDMXN }
  - { symbol: BAP,  asset_class: equity, region: latam, name: Credicorp Ltd (Peru), sources: { primary: tiingo }, fx_pair: USDPEN }
  - { symbol: SQM,  asset_class: equity, region: latam, name: Sociedad Quimica y Minera (Chile), sources: { primary: tiingo }, fx_pair: USDCLP }

backtest:
  initial_cash: 10000
  fee_bps: 10                      # per side, taker-fee ballpark
  slippage_bps: 5                  # applied adversely on every fill
  strategies:
    - name: sma_cross
      params: { fast: 20, slow: 50 }
    - name: macd
      params: { fast: 12, slow: 26, signal: 9 }
    - name: rsi_reversion
      params: { period: 14, entry_below: 30, exit_above: 50 }
    - name: volume_breakout
      params: { price_window: 20, volume_window: 20, volume_mult: 1.5 }
      requires_volume: true        # skipped for FX, which has no volume
    - name: fibonacci
      params: { window: 100, ratio: 0.618 }

  # Every non-empty AND-combination of the strategies above is also evaluated
  # ("long only while every selected signal is green"): 31 variants per asset
  # with volume, 15 for FX. Only single strategies keep an equity curve — storing
  # 1,347 curves per run would not fit the database's free tier.
  combinations:
    enabled: true
    store_curves: false

  # Guard against data dredging: with ~1,347 variants, some look brilliant by
  # chance alone. Each variant is therefore also scored on a held-out window it
  # never influenced.
  train_fraction: 0.7

export:
  dir: exports
  index_file: index.json           # light: every asset + headline metrics
  per_symbol_dir: backtests        # exports/backtests/<SYMBOL>.json (equity curves)
  equity_curve_max_points: 400
